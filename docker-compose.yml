services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  server:
    image: node:22-alpine
    working_dir: /workspace/server
    command: sh -c "npm install && npm run dev"
    volumes:
      - .:/workspace
    environment:
      PORT: ${PORT:-5000}
      MONGO_URI: ${MONGO_URI:-mongodb://mongo:27017/pharmacy_management}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
    depends_on:
      - mongo
    ports:
      - '5000:5000'

  client:
    image: node:22-alpine
    working_dir: /workspace/client
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - .:/workspace
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:5000/api}
    depends_on:
      - server
    ports:
      - '5173:5173'

volumes:
  mongo_data:
